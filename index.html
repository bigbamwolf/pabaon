<head>

<style>
:root{--red:#C8102E;--y:#EFC52B;--y2:#F7DD7A;--yl:#FFF6D6;--k:#0F0F0F;--k2:#3a3a3a;--mute:#6f6a5e;--paper:#FAF9F6;--card:#fff;--line:#ece7da;--ok:#1f8a4c;--okl:#e6f4ec;--bad:#c62828;--badl:#fdecea;--r:16px;--sh:0 4px 18px rgba(15,15,15,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--k);font:500 15px/1.5 'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px}
h1,h2,h3{font-family:'Fira Sans',sans-serif;font-weight:900;margin:0;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--k)}
.top{position:sticky;top:0;z-index:20;background:var(--k);display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));box-shadow:0 2px 10px rgba(0,0,0,.08)}
.top img{height:42px;display:block}
.top nav{margin-left:auto;display:flex;gap:4px}
.top nav a{font:800 13px 'Nunito',sans-serif;text-decoration:none;padding:7px 11px;border-radius:999px;color:#fff}
.top nav a.on{background:var(--y);color:var(--k)}
.test{background:var(--y);color:var(--k);text-align:center;font:700 12px 'Nunito',sans-serif;padding:5px 16px;letter-spacing:.4px}
main{max-width:640px;margin:0 auto;padding:0 16px}
.hero{position:relative;margin:16px 0 8px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#3a2a12,#0F0F0F);min-height:200px;box-shadow:var(--sh)}
.hero img{width:100%;height:220px;object-fit:cover;display:block;opacity:.92}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.hero h1{font-size:28px;line-height:1.05;color:#fff}
.hero h1 b{color:var(--y)}
.hero p{margin:6px 0 0;font:700 13.5px 'Nunito',sans-serif;opacity:.95}
.notice{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--yl);border:1px solid var(--y2);font-size:13.5px}
.notice.bad{background:var(--badl);border-color:#f3c4c0;color:var(--bad)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec h2{font-size:20px}
.sec span{color:var(--mute);font-size:13px}
.meal{display:flex;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.meal:active{border-color:var(--y)}
.meal img{width:112px;height:112px;object-fit:cover;border-radius:12px;flex:0 0 112px;background:var(--yl)}
.meal .info{flex:1;display:flex;flex-direction:column;min-width:0}
.meal h3{font-size:16.5px;line-height:1.2}
.meal p{margin:4px 0 0;color:var(--mute);font-size:12.5px;line-height:1.35}
.meal .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.price{font:900 18px 'Fira Sans',sans-serif;color:var(--red)}
.badge{display:inline-block;font:800 10.5px 'Nunito',sans-serif;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-bottom:4px}
.badge.hot{background:var(--red);color:#fff}.badge.sulit{background:var(--y);color:var(--k)}.badge.budget{background:var(--k);color:var(--y)}
.serves{display:inline-block;margin-top:4px;font:700 11.5px 'Nunito',sans-serif;color:var(--k2)}
.promos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 4px;padding:0 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promos.slider{scroll-behavior:smooth;margin:12px 0 0;padding:0;gap:0;border-radius:18px}
.promos.slider .promo{flex:0 0 100%;max-width:none}
.dots{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.dots i{width:7px;height:7px;border-radius:999px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:20px;background:var(--k)}
@media(min-width:760px){.promos.slider{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:visible;margin:12px 0 4px;padding:0;border-radius:0}.promos.slider .promo{max-width:none}.dots{display:none}}
.promo{flex:0 0 86%;max-width:420px;scroll-snap-align:start;border-radius:18px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;min-height:118px}
.promo b{display:block;font:900 22px/1.05 'Fira Sans',sans-serif}
.promo p{margin:6px 0 0;font:700 13px 'Nunito',sans-serif;opacity:.95}
.promo .tag{display:inline-block;margin-bottom:7px;background:#fff;color:var(--red);border-radius:999px;padding:3px 10px;font:900 11.5px 'Fira Sans',sans-serif;letter-spacing:.3px}
.promo.red{background:linear-gradient(135deg,#C8102E,#8E0B20)}.promo.dark{background:linear-gradient(135deg,#1d1d1d,#3a2a12)}.promo.gold{background:linear-gradient(135deg,#EFC52B,#d9a400);color:var(--k)}
.promo.gold .tag{color:var(--k)}
.rev{flex:0 0 78%;max-width:360px;scroll-snap-align:start;background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.rev img{width:100%;height:150px;object-fit:cover;display:block}
.rev div{padding:12px 14px}
.rev .st{color:var(--y);letter-spacing:1px}
.rev q{display:block;font-size:13.5px;margin:4px 0 6px;quotes:none}
.rev small{color:var(--mute);font-weight:700}
.addbtn{background:var(--y);border:0;border-radius:999px;padding:8px 16px;font:800 14px 'Nunito',sans-serif;cursor:pointer}
.incart{font:800 12px 'Nunito',sans-serif;background:var(--k);color:var(--y);border-radius:999px;padding:3px 9px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font:800 15px 'Nunito',sans-serif}
.li .nm small{color:var(--mute)}
.step{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:999px;border:1px solid var(--line)}
.step button{width:36px;height:36px;border:0;background:none;font:800 20px 'Nunito',sans-serif;cursor:pointer;border-radius:50%}
.step button:disabled{opacity:.3}
.step span{min-width:22px;text-align:center;font:800 15px 'Nunito',sans-serif}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.bar button{width:100%;max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;background:var(--k);color:#fff;border:0;border-radius:16px;padding:15px 18px;font:800 16px 'Nunito',sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar button .n{background:var(--y);color:var(--k);border-radius:999px;padding:2px 10px;margin-right:8px}
.bar button:disabled{opacity:.6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:0 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;max-width:640px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet .ph{height:180px;background:var(--k) center/cover}
.sheet .bd{padding:16px}
.sheet h3{font-size:22px}
.sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:12px 0}
.card h2{font-size:18px;margin-bottom:10px}
label.f{display:block;font:800 13px 'Nunito',sans-serif;margin:12px 0 5px}
label.f small{font:500 12px 'Open Sans',sans-serif;color:var(--mute)}
input.i,select.i,textarea.i{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--y)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:800 14px 'Nunito',sans-serif;cursor:pointer}
.seg button.on{background:var(--k);color:var(--y);border-color:var(--k)}
.seg button:disabled{opacity:.35}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;padding:9px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:800 13px 'Nunito',sans-serif;cursor:pointer;text-align:left}
.days button small{display:block;font:500 11px 'Open Sans',sans-serif;color:var(--mute)}
.days button.on{background:var(--k);color:var(--y);border-color:var(--k)}
.days button.on small{color:#ddd}
.days button:disabled{opacity:.4}
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:5px 0;vertical-align:top}
.sum td:last-child{text-align:right;white-space:nowrap}
.sum tr.free td{color:var(--ok)}
.sum s{color:var(--mute);margin-right:6px;font-weight:500}
.saved{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--okl);color:var(--ok);font:800 14px 'Nunito',sans-serif;text-align:center}
.sum tr.tot td{border-top:1.5px dashed var(--line);padding-top:10px;font:900 19px 'Fira Sans',sans-serif}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--y);font:800 16px 'Nunito',sans-serif;cursor:pointer;text-align:center;text-decoration:none;color:var(--k)}
.btn.dark{background:var(--k);color:var(--y)}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn:disabled{opacity:.55}
.err{background:var(--badl);color:var(--bad);border-radius:12px;padding:11px 13px;margin:12px 0;font-size:14px;display:none}
.okbox{background:var(--okl);color:var(--ok);border-radius:12px;padding:11px 13px;margin:12px 0;font-size:14px}
.big{font:900 30px 'Fira Sans',sans-serif;letter-spacing:.5px}
.muted{color:var(--mute);font-size:13px}
.pay{border:1.5px dashed var(--y);background:var(--yl);border-radius:14px;padding:12px 14px;margin:10px 0}
.pay b{font-family:'Nunito',sans-serif}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px;color:var(--mute)}
.tl li:before{content:'';position:absolute;left:8px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.tl li:after{content:'';position:absolute;left:15px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.done{color:var(--k)}
.tl li.done:before{background:var(--y);border-color:var(--k)}
.tl li.done:after{background:var(--k)}
.tl li b{display:block;font:800 15px 'Nunito',sans-serif}
.tl li small{font-size:12px}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,64px));justify-content:center;gap:10px;margin:12px 0}
.stamps div{aspect-ratio:1;border-radius:50%;border:2.5px solid var(--y);display:flex;align-items:center;justify-content:center;font:900 15px 'Fira Sans',sans-serif;color:var(--y)}
.stamps div.on{background:var(--y);color:var(--k)}
.prev{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{max-width:640px;margin:28px auto 0;padding:0 16px 24px;text-align:center;color:var(--mute);font-size:12.5px}
footer b{color:var(--k);font-family:'Nunito',sans-serif}
.center{text-align:center}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--k);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
#map{height:240px;border-radius:12px;margin-top:8px;border:1.5px solid var(--line);z-index:1}
.maprow{display:flex;gap:8px;margin-top:8px}
.maprow input{flex:1;min-width:0}
.maprow button{flex:0 0 auto;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:800 13px 'Nunito',sans-serif;cursor:pointer}
.quote{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--yl);font-size:13.5px}
.quote.bad{background:var(--badl);color:var(--bad)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--k);border:3px solid var(--y);transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.qr{display:flex;gap:12px;align-items:center}
.qr img{width:132px;height:132px;border-radius:10px;background:#fff;padding:4px;flex:0 0 132px}
.qr > div{min-width:0;flex:1}
.qr .acct{font:900 17px 'Fira Sans',sans-serif;letter-spacing:.5px;overflow-wrap:anywhere}
@media(max-width:400px){.qr{flex-direction:column;align-items:flex-start}.qr img{width:150px;height:150px;flex-basis:auto;align-self:center}}
.layout2{display:block}
@media(min-width:960px){main{max-width:980px}.layout2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}.layout2 .side{position:sticky;top:84px}.meals{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meals .meal{margin:0}}
@media(min-width:700px){.hero img{height:280px}.meal img{width:132px;height:132px;flex-basis:132px}}
</style>
</head>
<body>
<header class="top">
  <a href="#/" aria-label="PABAON home"><img src="logo-sm.png" alt="PABAON" width="88" height="42"></a>
  <nav><a href="#/" data-v="menu">Menu</a><a href="#/track" data-v="track">Track</a><a href="#/stamps" data-v="stamps">Stamps</a></nav>
</header>
<main id="app"><section class="hero"><img src="img/hero.jpg" alt="PABAON kare-kare"><div class="cap"><h1>Kare-kare, <b>made the way home tastes.</b></h1><p>Delivered or for pick up. Free bagoong with every meal.</p></div></section><p class="center" style="padding:30px 0"><span class="spin"></span></p></main>
<div class="bar" id="bar" style="display:none"><button id="barBtn" onclick="go('#/checkout')"></button></div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<footer><b>PABAON</b> by A&amp;D Artisan Foods Corporation<br>A true taste of home, anytime and anywhere.</footer>
<script>
var API = 'https://script.google.com/macros/s/AKfycbzfno6dVwc1_Wb8Xp85pjkyh_LCp8-0bctvmxuORTFKmh8R01XZUeWbrtbl6L9fuWRWBQ/exec';
var PHOTO = { 'KK-TRIPE': 'img/kk.jpg', 'KK-BAGNET': 'img/kk.jpg', 'KK-OVER': 'img/hero.jpg', 'KK-BAGOONG': 'img/bagoong.jpg', 'KK-SAUCE': 'img/kk.jpg', 'GULAMAN': 'img/palamig.jpg' };
var BLURB = {
  'KK-TRIPE': 'Tender beef tripe in our slow cooked peanut sauce, with vegetables and bagoong.',
  'KK-BAGNET': 'Crispy bagnet over rich kare-kare sauce, with vegetables and bagoong.',
  'KK-OVER': 'The best of both. Bagnet and twalya (beef tripe) in one big serving.'
};
var BADGE = { 'KK-BAGNET': ['Best seller', 'hot'], 'KK-OVER': ['Sulit meal', 'sulit'], 'KK-TRIPE': ['Budget friendly', 'budget'] };
var ORDER = ['KK-BAGNET', 'KK-OVER', 'KK-TRIPE'];
var SERVES = 'Good for 2 to 3';
var S = null, CART = {}, CO = { fulfillment: 'DELIVERY', payment: '', date: '', time: '' }, PROOF = '';

function $(id){ return document.getElementById(id); }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function peso(n){ return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function go(h){ location.hash = h; }

async function api(body){
  var r;
  try {
    r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) {
    if (body.photo) throw new Error('Network problem. Please try again.');
    r = await fetch(API + '?api=' + encodeURIComponent(JSON.stringify(body)));
  }
  var j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}

function item(id){ return S.menu.filter(function(m){ return m.id === id; })[0]; }
function cartLines(){ return Object.keys(CART).filter(function(k){ return CART[k] > 0 && item(k); }).map(function(k){ return { item_id: k, qty: CART[k] }; }); }
function cartQty(){ return cartLines().reduce(function(a, l){ return a + l.qty; }, 0); }
function cartFood(){ return cartLines().reduce(function(a, l){ return a + l.qty * item(l.item_id).price; }, 0); }
function cartMeals(){ return cartLines().reduce(function(a, l){ return a + (item(l.item_id).meal ? l.qty : 0); }, 0); }
function fee(){ return CO.fulfillment === 'DELIVERY' ? (CO.quote ? CO.quote.fee : 0) : 0; }
function saveCart(){ store('pb_cart', CART); }
function setQty(id, q){ CART[id] = Math.max(0, Math.min(S.max_qty, q)); saveCart(); }

function bar(){
  var n = cartQty(), v = (location.hash || '#/').split('/')[1] || '';
  var show = n > 0 && (v === '' || v === 'menu');
  $('bar').style.display = show ? 'block' : 'none';
  if (show) $('barBtn').innerHTML = '<span><span class="n">' + n + '</span>View cart</span><span>' + peso(cartFood()) + '</span>';
}

function route(){
  var parts = (location.hash || '#/').slice(2).split('/'), v = parts[0] || 'menu';
  document.querySelectorAll('.top nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.v === v || (v === 'checkout' && a.dataset.v === 'menu')); });
  closeSheet();
  window.scrollTo(0, 0);
  if (!S && v !== 'track' && v !== 'stamps') return;
  if (v === 'checkout') checkout();
  else if (v === 'placed') placed();
  else if (v === 'track') track(parts[1] || '');
  else if (v === 'stamps') stamps();
  else menu();
  bar();
}

function stepper(id, q, cb){
  return '<div class="step"><button aria-label="Less" onclick="event.stopPropagation();' + cb + '(\'' + id + '\',-1)"' + (q <= 0 ? ' disabled' : '') + '>&minus;</button><span>' + q + '</span><button aria-label="More" onclick="event.stopPropagation();' + cb + '(\'' + id + '\',1)"' + (q >= S.max_qty ? ' disabled' : '') + '>+</button></div>';
}

function menu(){
  var meals = S.menu.filter(function(m){ return m.meal; }).sort(function(a, b){ return (ORDER.indexOf(a.id) + 99) % 99 - (ORDER.indexOf(b.id) + 99) % 99; }), adds = S.menu.filter(function(m){ return !m.meal; });
  var h = promos() + '<section class="hero"><img src="img/hero.jpg" alt="PABAON kare-kare"><div class="cap"><h1>Kare-kare, <b>made the way home tastes.</b></h1><p>Delivered or for pick up. Free bagoong with every meal.</p></div></section>';
  if (!S.open) h += '<div class="notice bad">We are not taking online orders right now. Please check back soon.</div>';
  else h += '<div class="notice">Open ' + hr12(Number(String(S.slots[1] && S.slots[1].times[0] ? S.slots[1].times[0].value : '10').slice(0,2))) + ' to 9 PM. Order at least an hour ahead, or book up to a few days ahead. Delivery ' + peso(S.fee_rule.first) + ' for the first km, plus ' + peso(S.fee_rule.per) + ' per km after' + (S.delivery_area ? ', ' + esc(S.delivery_area) : '') + '.</div>';

function startPromos(){

  var box = $('promos'); if (!box) return;
  var dots = $('dots').children, n = box.children.length, idle = true;
  function cur(){ return Math.round(box.scrollLeft / (box.children[0].offsetWidth)); }
  function mark(){ var c = cur(); for (var i = 0; i < dots.length; i++) dots[i].className = i === c ? 'on' : ''; }
  box.addEventListener('scroll', function(){ requestAnimationFrame(mark); }, { passive: true });
  box.addEventListener('touchstart', function(){ idle = false; setTimeout(function(){ idle = true; }, 8000); }, { passive: true });
  if (window.matchMedia('(min-width:760px)').matches || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  PROMO_TIMER = setInterval(function(){
    if (!idle || document.hidden || !document.body.contains(box)) return;

    + (r.fee ? '<tr><td>Delivery fee, paid to the rider</td><td>' + peso(r.fee) + '</td></tr>' : '') + '<tr class="tot"><td>Total</td><td>' + peso(r.total) + '</td></tr></table>' + (r.saved ? '<div class="saved">You saved ' + peso(r.saved) + ' on free add ons</div>' : '')
    + '<p class="muted">' + esc(r.slot_label) + ' &middot; ' + esc(r.payment) + '</p></div>';
  if (!/^CASH ON/.test(r.payment)) h += '<div class="card"><h2>Pay and upload your proof</h2>' + payBox(r.pay_to, r.total) + proofForm(r.order_id, last.phone) + '</div>';
  else h += '<div class="okbox">' + (r.payment === 'CASH ON PICK UP' ? 'Cash on pick up. We will confirm your order and text you the pick up spot. Please prepare ' : 'Cash on delivery. We will confirm your order shortly. Please prepare ') + peso(r.total) + '.</div>';
  h += '<a class="btn dark" href="#/track/' + encodeURIComponent(r.order_id) + '">Track my order</a>';
  $('app').innerHTML = h;
}

function proofForm(id, phone){
  PROOF = '';
  return '<label class="f" for="pf">Payment screenshot</label><input class="i" type="file" id="pf" accept="image/*" onchange="pickProof(this)"><img class="prev" id="pprev" alt="">'
    + '<label class="f" for="pref">Reference number <small>optional</small></label><input class="i" id="pref" maxlength="60">'
    + '<div class="err" id="perr"></div><br><button class="btn" id="psend" onclick="sendProof(\'' + esc(id) + '\',\'' + esc(phone) + '\')">Send payment proof</button>';
}
function pickProof(input){
  PROOF = '';
  var f = input.files && input.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function(){
    var max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    PROOF = c.toDataURL('image/jpeg', 0.8); $('pprev').src = PROOF; $('pprev').style.display = 'block'; URL.revokeObjectURL(url);
  };
  img.onerror = function(){ var e = $('perr'); e.textContent = 'That file is not a photo we can read. Try a screenshot.'; e.style.display = 'block'; };
  img.src = url;
}
async function sendProof(id, phone){
  var e = $('perr'); e.style.display = 'none';
  if (!PROOF) { e.textContent = 'Attach the screenshot of your payment first'; e.style.display = 'block'; return; }
  var b = $('psend'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Sending';
  try {
    await api({ action: 'proof', order_id: id, phone: phone, photo: PROOF, reference: $('pref').value });
    b.parentNode.innerHTML = '<div class="okbox">Payment proof sent. We will confirm it shortly.</div><a class="btn dark" href="#/track/' + encodeURIComponent(id) + '">Track my order</a>';
  } catch (err) { e.textContent = err.message; e.style.display = 'block'; b.disabled = false; b.textContent = 'Send payment proof'; }
}

var TRACK_TIMER = null;
function track(id){
  clearInterval(TRACK_TIMER);
  var last = store('pb_last') || {}, me = store('pb_me') || {};
  id = decodeURIComponent(id || '') || last.order_id || '';
  var phone = (last.order_id === id && last.phone) || me.phone || '';
  $('app').innerHTML = '<div class="sec"><h2>Track my order</h2></div><div class="card"><label class="f" for="tid">Order number</label><input class="i" id="tid" placeholder="PB261024-1234" value="' + esc(id) + '" autocapitalize="characters">'
    + '<label class="f" for="tph">Mobile number used</label><input class="i" id="tph" inputmode="tel" value="' + esc(phone) + '"><div class="err" id="terr"></div><br><button class="btn dark" id="tbtn" onclick="doTrack()">Track</button></div><div id="tout"></div>';
  if (id && phone) doTrack();
}
async function doTrack(quiet){
  var e = $('terr'); if (!e) return; e.style.display = 'none';
  var id = $('tid').value.trim(), phone = $('tph').value.trim();
  if (!id || !phone) { e.textContent = 'Enter your order number and mobile number'; e.style.display = 'block'; return; }
  if (!quiet) $('tout').innerHTML = '<p class="center"><span class="spin"></span></p>';
  try {
    var t = await api({ action: 'track', order_id: id, phone: phone });
    var h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-family:Fira Sans;font-weight:900;font-size:18px">' + esc(t.order_id) + '</b><b>' + peso(t.total) + '</b></div>'
      + '<p class="muted" style="margin:4px 0 12px">' + esc(t.items) + '<br>' + esc(t.fulfillment) + ', ' + esc(t.slot_label) + '</p>';
    if (t.cancelled) h += '<div class="err" style="display:block">This order was cancelled' + (t.cancel_reason ? ' (' + esc(t.cancel_reason.toLowerCase()) + ')' : '') + '. Message us if this is a mistake.</div>';
    else h += '<ul class="tl">' + t.steps.map(function(s){ return '<li class="' + (s.done ? 'done' : '') + '"><b>' + esc(s.label) + '</b><small>' + esc(s.at || '') + '</small></li>'; }).join('') + '</ul>';
    if (t.ship_ref && !t.cancelled) h += '<p class="muted">Rider or booking ref: ' + esc(t.ship_ref) + '</p>';
    h += '</div>';
    if (t.needs_proof) h += '<div class="card"><h2>Pay and upload your proof</h2>' + payBox(t.pay_to, t.total) + proofForm(t.order_id, phone) + '</div>';
    else if (t.pay_status === 'PROOF SENT') h += '<div class="okbox">We got your payment proof. Waiting for confirmation.</div>';
    $('tout').innerHTML = h;
    clearInterval(TRACK_TIMER);
    if (!t.cancelled && t.fill_status !== 'DELIVERED') TRACK_TIMER = setInterval(function(){ if (!document.hidden && !PROOF && location.hash.indexOf('#/track') === 0) doTrack(true); }, 30000);
  } catch (err) { if (!quiet) { $('tout').innerHTML = ''; e.textContent = err.message; e.style.display = 'block'; } }
}

function stamps(){
  var me = store('pb_me') || {};
  $('app').innerHTML = '<div class="sec"><h2>My loyalty stamps</h2></div><div class="card"><p class="muted" style="margin-top:0">Collect 5 stamps for a free drink, 15 for a free Special Kare-Kare.</p>'
    + '<label class="f" for="sph">Mobile number</label><input class="i" id="sph" inputmode="tel" value="' + esc(me.phone || '') + '"><div class="err" id="serr"></div><br><button class="btn dark" onclick="doStamps()">Check my stamps</button></div><div id="sout"></div>';
  if (me.phone) doStamps();
}
async function doStamps(){
  var e = $('serr'); e.style.display = 'none';
  $('sout').innerHTML = '<p class="center"><span class="spin"></span></p>';
  try {
    var s = await api({ action: 'stamps', phone: $('sph').value });
    var h = '<div class="card"><div class="stamps">';
    for (var i = 1; i <= s.full; i++) h += '<div class="' + (i <= s.stamps ? 'on' : '') + '">' + (i === s.small ? '&#9749;' : i === s.full ? '&#9733;' : i) + '</div>';
    h += '</div>';
    h += !s.found ? '<p class="muted">No stamps yet for this number. You earn a stamp with every qualified purchase.</p>'
      : '<p><b>' + s.stamps + ' stamp' + (s.stamps === 1 ? '' : 's') + '</b>. '
        + (s.can_full ? 'You can claim a free Special Kare-Kare!' : s.can_small ? 'You can claim a free drink! ' + s.to_full + ' more to a free Special.' : s.to_small ? s.to_small + ' more to a free drink.' : s.to_full + ' more to a free Special.') + '</p>';
    $('sout').innerHTML = h + '</div>';
  } catch (err) { $('sout').innerHTML = ''; e.textContent = err.message; e.style.display = 'block'; }
}

async function refreshStore(){
  try { S = await api({ action: 'store' }); store('pb_store', S); } catch (e) { if (!S) { $('app').innerHTML = '<div class="card center"><h2>We could not load the menu</h2><p class="muted">' + esc(e.message) + '</p><button class="btn" onclick="boot()">Try again</button></div>'; } return false; }
  return true;
}
/** Last menu kept on the phone so a returning customer sees it at once; fresh slots and prices replace it a moment later. */
async function boot(){
  CART = store('pb_cart') || {};
  var cached = store('pb_store');
  if (cached && cached.menu) { S = cached; route(); }
  if (await refreshStore()) {
    var v = (location.hash || '#/').slice(2).split('/')[0];
    if (v === 'track' || v === 'stamps') return;
    if (!cached || v === '' || v === 'menu') route();
    else if (v === 'checkout' && $('days')) { days(); pays(); sum(); }
  }
}
window.addEventListener('hashchange', route);
route();
boot();
</script>
